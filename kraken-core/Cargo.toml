[package]
name = "kraken-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]

aya = { version = "0.12.0", features = ["async_tokio"] }
aya-obj = "0.1.0"
tokio = { version = "1.35", features = ["full"] }
tokio-socks = "0.5.1"
regex = "1.10"
genpdf = "0.2"

rusttype = "0.9"
kraken-common = { path = "../kraken-common", features = ["user"] }


pnet = "0.34.0"
network-types = "0.0.5"


colored = "2.1.0"
rand = "0.8.5"
anyhow = "1.0.79"
env_logger = "0.11.0"
log = "0.4.20"
chrono = "0.4.44"
serde = { version = "1.0.228", features = ["derive"] }

[build-dependencies]
anyhow = "1.0.79"
